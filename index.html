<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body> 
    <div class="container">

        <div class="header">
            <h1>Weather App</h1>
        </div>

        <form id="searchBox">

            <div class="inputareaAndsubmitBtn"> 
                    <input type="text" id="cityInput" name="cname" placeholder="Enter city" required/>
                    <button type="submit">Submit</button>
            </div>

        </form>

        <div id="loadingMessage"></div>

        <div class="gridTop">

            <div class="todaysweather">
                <h3></h3>
                <p class="pafterh3"></p>
            </div>

            <div class="leftGrid">

                <img id="showIcon">

                <div class="temp_icons">
                    
                </div>

                

                <div class="temperature">
                
                </div>
            </div>

            <div class="rightGrid">
                <div class="time_day">
                    
                </div>

                <div class="status">
                    
                </div>
            </div>


        </div>

        <button class="pressBtn">7 Days Forecast</button>

        <div class="downGrid">
            <div class="area0 areaColumn">
                <div class="areaRow">Row 1</div>
                <div class="areaRow">Row 2</div>
                <div class="areaRow">Row 3</div>
                <div class="areaRow">Row 4</div>
            </div>
            <div class="area1 areaColumn">
                <div class="areaRow">Row 1</div>
                <div class="areaRow">Row 2</div>
                <div class="areaRow">Row 3</div>
                <div class="areaRow">Row 4</div>
            </div>
            <div class="area2 areaColumn">
                <div class="areaRow">Row 1</div>
                <div class="areaRow">Row 2</div>
                <div class="areaRow">Row 3</div>
                <div class="areaRow">Row 4</div>
            </div>
            <div class="area3 areaColumn">
                <div class="areaRow">Row 1</div>
                <div class="areaRow">Row 2</div>
                <div class="areaRow">Row 3</div>
                <div class="areaRow">Row 4</div>
            </div>
            <div class="area4 areaColumn">
                <div class="areaRow">Row 1</div>
                <div class="areaRow">Row 2</div>
                <div class="areaRow">Row 3</div>
                <div class="areaRow">Row 4</div>
            </div>
            <div class="area5 areaColumn">
                <div class="areaRow">Row 1</div>
                <div class="areaRow">Row 2</div>
                <div class="areaRow">Row 3</div>
                <div class="areaRow">Row 4</div>
            </div>
            <div class="area6 areaColumn">
                <div class="areaRow">Row 1</div>
                <div class="areaRow">Row 2</div>
                <div class="areaRow">Row 3</div>
                <div class="areaRow">Row 4</div>
            </div>
         
        </div>
       

        <form id="getCountryandCity" action="toserever" method="post">

        </form>





    </div>

    <script src="makescipt.js">

    </script>
    
</body>
</html>
